<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Fleck - A fast, drawing-first note-taking web application with infinite canvas.">
  <meta name="theme-color" content="#18191c">
  <title>Fleck — Visual Notes & Sketchpad</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
</head>
<body class="fleck-app">

  <!-- ================= TOP TOOLBAR ================= -->
  <header class="top-toolbar" id="top-toolbar" role="banner">
    <!-- Left Section: Brand & Pages -->
    <div class="toolbar-section toolbar-left">
      <div class="brand-badge" title="Fleck - Visual Notes">
        <svg class="brand-logo" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4 21l3.52-.95C8.98 20.61 10.45 21 12 21c4.97 0 9-4.03 9-9s-4.03-9-9-9z"/>
          <path d="M8.5 13.5l2 2 5-5" stroke-width="2.2"/>
        </svg>
        <span class="brand-name">Fleck</span>
      </div>

      <div class="divider-v"></div>

      <!-- Page / Note Selector -->
      <div class="page-selector-container">
        <div class="select-wrapper">
          <svg class="select-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
          <select id="page-select" class="page-dropdown" aria-label="Select note page">
            <option value="page-default">Untitled Note</option>
          </select>
          <svg class="chevron-down" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>

        <button type="button" class="btn-icon" id="btn-new-page" data-tooltip="New Page (Ctrl+N)" aria-label="Create new page">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>

        <button type="button" class="btn-icon" id="btn-page-manager" data-tooltip="Manage Pages" aria-label="Open page manager">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
        </button>
      </div>
    </div>

    <!-- Center Section: History & Navigation -->
    <div class="toolbar-section toolbar-center">
      <div class="button-group" role="group" aria-label="History actions">
        <button type="button" class="btn-icon" id="btn-undo" data-tooltip="Undo (Ctrl+Z)" aria-label="Undo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 14L4 9l5-5"/>
            <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/>
          </svg>
        </button>
        <button type="button" class="btn-icon" id="btn-redo" data-tooltip="Redo (Ctrl+Y)" aria-label="Redo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 14l5-5-5-5"/>
            <path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"/>
          </svg>
        </button>
      </div>

      <div class="divider-v"></div>

      <!-- Zoom Controls -->
      <div class="button-group zoom-group" role="group" aria-label="Zoom controls">
        <button type="button" class="btn-icon" id="btn-zoom-out" data-tooltip="Zoom Out (Ctrl+-)" aria-label="Zoom out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
        </button>
        <button type="button" class="zoom-value-btn" id="zoom-display" data-tooltip="Reset Zoom (Shift+1)" aria-label="Reset zoom">
          100%
        </button>
        <button type="button" class="btn-icon" id="btn-zoom-in" data-tooltip="Zoom In (Ctrl++)" aria-label="Zoom in">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="11" y1="8" x2="11" y2="14"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
        </button>
        <button type="button" class="btn-icon" id="btn-zoom-reset" data-tooltip="Fit Canvas (Shift+0)" aria-label="Reset zoom and center">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Right Section: Actions & Settings -->
    <div class="toolbar-section toolbar-right">
      <button type="button" class="btn-icon btn-danger-hover" id="btn-clear" data-tooltip="Clear Canvas" aria-label="Clear canvas">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      </button>

      <button type="button" class="btn-action" id="btn-export-png" data-tooltip="Export Image (Ctrl+E)" aria-label="Export canvas as PNG">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span class="btn-label">Export</span>
      </button>

      <div class="divider-v"></div>

      <!-- Theme Switcher -->
      <button type="button" class="btn-icon theme-toggle" id="btn-theme-toggle" data-tooltip="Toggle Dark / Light Theme" aria-label="Toggle theme">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- ================= LEFT SIDEBAR (TOOLS) ================= -->
  <aside class="left-sidebar" id="left-sidebar" role="region" aria-label="Drawing Tools">
    <div class="sidebar-inner">
      <!-- Drawing Tools Group -->
      <nav class="tools-group" role="toolbar" aria-label="Drawing Tools">
        <!-- Select / Pointer (V) -->
        <button type="button" class="tool-btn active" id="tool-select" data-tool="select" data-tooltip="Select (V)" aria-label="Select Tool" aria-pressed="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3l7 18 3-7 7-3L3 3z"></path>
          </svg>
        </button>

        <!-- Pen / Freehand Draw (P) -->
        <button type="button" class="tool-btn" id="tool-pen" data-tool="pen" data-tooltip="Draw (P)" aria-label="Pen / Draw Tool" aria-pressed="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
            <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
            <path d="M2 2l7.586 7.586"></path>
            <circle cx="11" cy="11" r="2"></circle>
          </svg>
        </button>

        <!-- Line (L) -->
        <button type="button" class="tool-btn" id="tool-line" data-tool="line" data-tooltip="Line (L)" aria-label="Line Tool" aria-pressed="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="19" x2="19" y2="5"></line>
            <circle cx="5" cy="19" r="2"></circle>
            <circle cx="19" cy="5" r="2"></circle>
          </svg>
        </button>

        <!-- Arrow (A) -->
        <button type="button" class="tool-btn" id="tool-arrow" data-tool="arrow" data-tooltip="Arrow (A)" aria-label="Arrow Tool" aria-pressed="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="19" x2="19" y2="5"></line>
            <polyline points="10 5 19 5 19 14"></polyline>
          </svg>
        </button>

        <!-- Rectangle (R) -->
        <button type="button" class="tool-btn" id="tool-rect" data-tool="rect" data-tooltip="Rectangle (R)" aria-label="Rectangle Tool" aria-pressed="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2" ry="2"></rect>
          </svg>
        </button>

        <!-- Ellipse (E) -->
        <button type="button" class="tool-btn" id="tool-ellipse" data-tool="ellipse" data-tooltip="Ellipse (E)" aria-label="Ellipse Tool" aria-pressed="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
          </svg>
        </button>

        <!-- Diamond (D) -->
        <button type="button" class="tool-btn" id="tool-diamond" data-tool="diamond" data-tooltip="Diamond (D)" aria-label="Diamond Tool" aria-pressed="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2l9 10-9 10L3 12 12 2z"></path>
          </svg>
        </button>

        <!-- Text (T) -->
        <button type="button" class="tool-btn" id="tool-text" data-tool="text" data-tooltip="Text (T)" aria-label="Text Tool" aria-pressed="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 7 4 4 20 4 20 7"></polyline>
            <line x1="9" y1="20" x2="15" y2="20"></line>
            <line x1="12" y1="4" x2="12" y2="20"></line>
          </svg>
        </button>

        <!-- Sticky Note (S) -->
        <button type="button" class="tool-btn" id="tool-sticky" data-tool="sticky" data-tooltip="Sticky Note (S)" aria-label="Sticky Note Tool" aria-pressed="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3z"></path>
            <polyline points="15 3 15 9 21 9"></polyline>
            <line x1="7" y1="13" x2="13" y2="13"></line>
            <line x1="7" y1="17" x2="11" y2="17"></line>
          </svg>
        </button>

        <!-- Eraser (X) -->
        <button type="button" class="tool-btn" id="tool-eraser" data-tool="eraser" data-tooltip="Eraser (X)" aria-label="Eraser Tool" aria-pressed="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 20H7L3 16C2 15 2 13 3 12L13 2C14 1 16 1 17 2L21 6C22 7 22 9 21 10L12 19"></path>
            <line x1="18" y1="11" x2="7" y2="11"></line>
          </svg>
        </button>
      </nav>

      <div class="sidebar-divider"></div>
      <button type="button" class="tool-btn settings-tool-btn active" id="btn-style-settings" data-tooltip="Style Settings" aria-label="Toggle style settings" aria-expanded="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"></path>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.5 1.5-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V20h-2.12v-.09a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-1.5-1.5.06-.06A1.7 1.7 0 0 0 9.14 15a1.7 1.7 0 0 0-1.56-1.03H7.5v-2.12h.08A1.7 1.7 0 0 0 9.14 10a1.7 1.7 0 0 0-.34-1.88l-.06-.06 1.5-1.5.06.06a1.7 1.7 0 0 0 1.88.34 1.7 1.7 0 0 0 1.03-1.56V5h2.12v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 1.5 1.5-.06.06A1.7 1.7 0 0 0 19.4 10a1.7 1.7 0 0 0 1.56 1.03H21v2.12h-.04A1.7 1.7 0 0 0 19.4 15z"></path>
        </svg>
      </button>

      <div class="sidebar-divider"></div>

      <!-- Properties & Style Controls Section -->
      <section class="properties-section" id="properties-section" aria-label="Element Properties">
        <div class="properties-header">
          <span class="properties-title">Style Settings</span>
          <button type="button" class="btn-icon-xs" id="btn-close-style-settings" aria-label="Close style settings">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <!-- Stroke Color Picker -->
        <div class="property-item" data-tooltip="Stroke Color">
          <label class="property-label" for="stroke-color-picker">Stroke</label>
          <div class="color-picker-wrapper">
            <input type="color" id="stroke-color-picker" class="color-circle-input" value="#e2e8f0" aria-label="Stroke color">
            <span class="color-preview stroke-preview" id="stroke-color-indicator"></span>
          </div>
          <!-- Quick Palette -->
          <div class="quick-palette" id="stroke-palette">
            <button type="button" class="swatch-mini" data-color="#1e293b" style="--swatch-color: #1e293b;" title="Slate"></button>
            <button type="button" class="swatch-mini" data-color="#e2e8f0" style="--swatch-color: #e2e8f0;" title="White/Light"></button>
            <button type="button" class="swatch-mini" data-color="#ef4444" style="--swatch-color: #ef4444;" title="Red"></button>
            <button type="button" class="swatch-mini" data-color="#3b82f6" style="--swatch-color: #3b82f6;" title="Blue"></button>
            <button type="button" class="swatch-mini" data-color="#10b981" style="--swatch-color: #10b981;" title="Green"></button>
            <button type="button" class="swatch-mini" data-color="#f59e0b" style="--swatch-color: #f59e0b;" title="Amber"></button>
          </div>
        </div>

        <!-- Fill Color Picker -->
        <div class="property-item" data-tooltip="Fill Color">
          <div class="property-header-row">
            <label class="property-label" for="fill-color-picker">Fill</label>
            <button type="button" class="transparent-toggle active" id="btn-fill-transparent" data-tooltip="Toggle Transparent Fill" aria-label="Transparent Fill">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
              </svg>
            </button>
          </div>
          <div class="color-picker-wrapper">
            <input type="color" id="fill-color-picker" class="color-circle-input" value="#3b82f6" aria-label="Fill color">
            <span class="color-preview fill-preview transparent-pattern" id="fill-color-indicator"></span>
          </div>
          <!-- Quick Palette -->
          <div class="quick-palette" id="fill-palette">
            <button type="button" class="swatch-mini" data-color="transparent" style="--swatch-color: transparent;" title="Transparent"></button>
            <button type="button" class="swatch-mini" data-color="#3b82f633" style="--swatch-color: #3b82f633;" title="Pastel Blue"></button>
            <button type="button" class="swatch-mini" data-color="#10b98133" style="--swatch-color: #10b98133;" title="Pastel Green"></button>
            <button type="button" class="swatch-mini" data-color="#f59e0b33" style="--swatch-color: #f59e0b33;" title="Pastel Yellow"></button>
            <button type="button" class="swatch-mini" data-color="#ef444433" style="--swatch-color: #ef444433;" title="Pastel Red"></button>
            <button type="button" class="swatch-mini" data-color="#8b5cf633" style="--swatch-color: #8b5cf633;" title="Pastel Purple"></button>
          </div>
        </div>

        <div class="sidebar-divider"></div>

        <!-- Stroke Width Options -->
        <div class="property-item option-item">
          <div class="property-header-row">
            <span class="property-label">Width</span>
            <span class="slider-val" id="stroke-width-badge">2px</span>
          </div>
          <div class="option-buttons" id="stroke-width-options" role="group" aria-label="Stroke width">
            <button type="button" class="option-btn width-option" data-value="1" aria-label="1 pixel" title="1 px"><span></span></button>
            <button type="button" class="option-btn width-option" data-value="2" aria-label="2 pixels" title="2 px"><span></span></button>
            <button type="button" class="option-btn width-option" data-value="4" aria-label="4 pixels" title="4 px"><span></span></button>
            <button type="button" class="option-btn width-option" data-value="6" aria-label="6 pixels" title="6 px"><span></span></button>
            <button type="button" class="option-btn width-option" data-value="10" aria-label="10 pixels" title="10 px"><span></span></button>
          </div>
        </div>

        <!-- Opacity Options -->
        <div class="property-item option-item">
          <div class="property-header-row">
            <span class="property-label">Opacity</span>
            <span class="slider-val" id="opacity-badge">100%</span>
          </div>
          <div class="option-buttons" id="opacity-options" role="group" aria-label="Opacity">
            <button type="button" class="option-btn opacity-option" data-value="20" aria-label="20 percent" title="20%"><span></span></button>
            <button type="button" class="option-btn opacity-option" data-value="40" aria-label="40 percent" title="40%"><span></span></button>
            <button type="button" class="option-btn opacity-option" data-value="60" aria-label="60 percent" title="60%"><span></span></button>
            <button type="button" class="option-btn opacity-option" data-value="80" aria-label="80 percent" title="80%"><span></span></button>
            <button type="button" class="option-btn opacity-option" data-value="100" aria-label="100 percent" title="100%"><span></span></button>
          </div>
        </div>
      </section>
    </div>
  </aside>

  <!-- ================= MAIN CANVAS AREA ================= -->
  <main class="canvas-container" id="canvas-container" role="main">
    <canvas id="canvas" class="main-canvas" aria-label="Drawing Canvas"></canvas>

    <!-- Empty State Overlay -->
    <div class="empty-state" id="empty-state" aria-hidden="false">
      <div class="empty-state-card">
        <div class="empty-state-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
            <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
          </svg>
        </div>
        <p class="empty-state-text">Start drawing or press <kbd>T</kbd> for text</p>
        <span class="empty-state-subtext">Hold Space or Middle Mouse to pan</span>
      </div>
    </div>
  </main>

  <!-- ================= BOTTOM-RIGHT MINI FLOATING PANEL ================= -->
  <div class="bottom-panel" id="bottom-panel" role="complementary" aria-label="Canvas Minimap and Navigation Status">
    <!-- Minimap Card (Collapsible) -->
    <div class="minimap-card" id="minimap-card">
      <div class="minimap-header">
        <span class="minimap-title">Minimap</span>
        <button type="button" class="btn-icon-xs" id="btn-close-minimap" aria-label="Close minimap">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="minimap-canvas-container">
        <canvas id="minimap-canvas" width="160" height="100" aria-label="Canvas overview minimap"></canvas>
        <div class="minimap-viewport" id="minimap-viewport"></div>
      </div>
    </div>

    <!-- Status Bar (Coordinates & Zoom) -->
    <div class="status-bar" id="status-bar">
      <button type="button" class="status-btn" id="btn-toggle-minimap" data-tooltip="Toggle Minimap (M)" aria-label="Toggle minimap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <rect x="13" y="13" width="6" height="6"></rect>
        </svg>
      </button>
      <div class="status-divider"></div>
      <div class="coordinates-badge" id="coordinates-display" title="Canvas coordinates">
        <span class="coord-axis">X:</span> <span id="coord-x">0</span>
        <span class="coord-axis">Y:</span> <span id="coord-y">0</span>
      </div>
      <div class="status-divider"></div>
      <span class="bottom-zoom-badge" id="bottom-zoom-display" title="Current zoom level">100%</span>
    </div>
  </div>

  <!-- ================= CONTEXT MENU ================= -->
  <nav class="context-menu" id="context-menu" hidden aria-label="Canvas Context Menu">
    <button type="button" class="context-menu-item" data-action="bring-front">
      <span>Bring to Front</span>
      <kbd>]</kbd>
    </button>
    <button type="button" class="context-menu-item" data-action="send-back">
      <span>Send to Back</span>
      <kbd>[</kbd>
    </button>
    <div class="context-menu-divider"></div>
    <button type="button" class="context-menu-item" data-action="duplicate">
      <span>Duplicate</span>
      <kbd>Ctrl+D</kbd>
    </button>
    <button type="button" class="context-menu-item" data-action="copy">
      <span>Copy</span>
      <kbd>Ctrl+C</kbd>
    </button>
    <button type="button" class="context-menu-item" data-action="paste">
      <span>Paste</span>
      <kbd>Ctrl+V</kbd>
    </button>
    <div class="context-menu-divider"></div>
    <button type="button" class="context-menu-item item-danger" data-action="delete">
      <span>Delete</span>
      <kbd>Del</kbd>
    </button>
  </nav>

  <!-- ================= PAGES MANAGER MODAL ================= -->
  <div class="modal-backdrop" id="pages-modal-backdrop" hidden>
    <div class="modal-dialog" id="pages-modal" role="dialog" aria-modal="true" aria-labelledby="pages-modal-title">
      <div class="modal-header">
        <div class="modal-title-group">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
          <h2 class="modal-title" id="pages-modal-title">Pages & Notes</h2>
        </div>
        <button type="button" class="btn-icon" id="btn-close-pages-modal" aria-label="Close modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <form class="new-page-form" id="new-page-form">
          <input type="text" id="new-page-input" class="modal-input" placeholder="Enter page name..." maxlength="40" required>
          <button type="submit" class="btn-primary" id="btn-create-page-submit">Add Page</button>
        </form>

        <div class="pages-list-container">
          <label class="modal-section-label">Your Pages</label>
          <ul class="pages-list" id="modal-pages-list">
            <!-- Dynamically populated page list items -->
          </ul>
        </div>
      </div>

      <div class="modal-footer">
        <span class="modal-footnote">Notes are automatically saved locally.</span>
        <button type="button" class="btn-secondary" id="btn-modal-done">Done</button>
      </div>
    </div>
  </div>

  <!-- ================= SCRIPTS ================= -->
  <script type="module" src="js/utils.js"></script>
  <script type="module" src="js/history.js"></script>
  <script type="module" src="js/storage.js"></script>
  <script type="module" src="js/renderer.js"></script>
  <script type="module" src="js/tools.js"></script>
  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>

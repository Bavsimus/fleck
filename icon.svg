<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fleckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#3b82f6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Canvas Frame Outline -->
  <rect x="76" y="76" width="360" height="360" rx="36" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" stroke-dasharray="12 12"/>

  <!-- Fluid Sketch Stroke / Hand-drawn S-Curve -->
  <path d="M 130 360 C 180 370, 210 240, 270 230 C 330 220, 360 300, 390 270" 
        fill="none" 
        stroke="url(#fleckGrad)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Geometric Hand-drawn Diamond & Circle accents -->
  <rect x="140" y="140" width="64" height="64" rx="14" transform="rotate(45 172 172)" fill="none" stroke="#60a5fa" stroke-width="12" stroke-linecap="round"/>
  <circle cx="340" cy="160" r="32" fill="none" stroke="#f472b6" stroke-width="12" stroke-dasharray="8 8"/>

  <!-- Stylized Pencil / Stylus tip -->
  <g transform="translate(350, 230) rotate(45)">
    <path d="M 0 0 L 24 -12 L 80 -12 L 80 12 L 24 12 Z" fill="#f8fafc" />
    <path d="M 0 0 L 10 -5 L 10 5 Z" fill="#3b82f6" />
    <rect x="80" y="-12" width="20" height="24" rx="4" fill="#ef4444" />
  </g>
</svg>
